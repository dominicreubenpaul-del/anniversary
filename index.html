<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>Anniversary Is Coming ❤️</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Bebas+Neue&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="landing">

        <!-- =========================================
             MOBILE BACKGROUND
             Both photos form ONE phone screen
        ========================================== -->

        <div class="mobile-background" aria-hidden="true">

            <div class="mobile-eyes"></div>

            <div class="mobile-hands"></div>

            <div class="mobile-blend"></div>

        </div>


        <!-- =========================================
             DESKTOP BACKGROUND
        ========================================== -->

        <div class="desktop-background" aria-hidden="true">

            <section class="desktop-eyes"></section>

            <section class="desktop-hands"></section>

        </div>


        <!-- CINEMATIC EFFECTS -->

        <div class="cinematic-grade" aria-hidden="true"></div>

        <div class="vignette" aria-hidden="true"></div>

        <div class="red-glow" aria-hidden="true"></div>


        <!-- =========================================
             CONTENT
        ========================================== -->

        <section class="content">

            <!-- TITLE -->

            <header class="title">

                <h1>ANNIVERSARY</h1>

                <h2>IS COMING</h2>

            </header>


            <!-- HEART DIVIDER -->

            <div class="heart-divider">

                <span></span>

                <div class="heart">♡</div>

                <span></span>

            </div>


            <!-- COUNTDOWN -->

            <section
                class="countdown"
                aria-label="Countdown to our anniversary"
            >

                <div class="time-box">

                    <div class="number" id="months">00</div>

                    <div class="label">MONTHS</div>

                </div>


                <div class="colon">:</div>


                <div class="time-box">

                    <div class="number" id="days">00</div>

                    <div class="label">DAYS</div>

                </div>


                <div class="colon">:</div>


                <div class="time-box">

                    <div class="number" id="hours">00</div>

                    <div class="label">HOURS</div>

                </div>


                <div class="colon">:</div>


                <div class="time-box">

                    <div class="number" id="minutes">00</div>

                    <div class="label">MINUTES</div>

                </div>


                <div class="colon">:</div>


                <div class="time-box">

                    <div class="number" id="seconds">00</div>

                    <div class="label">SECONDS</div>

                </div>

            </section>


            <!-- DATE -->

            <div class="date">
                19 NOVEMBER 2026
            </div>


            <!-- ECG -->

            <div class="ecg-divider">

                <span></span>

                <svg
                    class="ecg"
                    viewBox="0 0 90 40"
                    aria-hidden="true"
                >

                    <polyline
                        points="
                            0,20
                            22,20
                            28,15
                            33,29
                            40,5
                            46,34
                            53,11
                            60,20
                            90,20
                        "
                    />

                </svg>

                <span></span>

            </div>


            <!-- MESSAGE -->

            <p class="forever">
                THE COUNTDOWN TO OUR FOREVER.
            </p>


            <p class="always">

                You. Me. Always.

                <span class="small-heart">♡</span>

            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
