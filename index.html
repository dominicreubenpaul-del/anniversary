<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>Anniversary Is Coming ❤️</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Bebas+Neue&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- ==========================================
         CINEMATIC LANDING PAGE
    =========================================== -->

    <main class="landing">

        <!-- TOP / EYES PHOTO -->

        <div class="photo-layer photo-eyes"></div>


        <!-- BOTTOM / HANDS PHOTO -->

        <div class="photo-layer photo-hands"></div>


        <!-- Blends both photographs -->

        <div class="middle-darkness"></div>


        <!-- Overall cinematic colour treatment -->

        <div class="cinematic-grade"></div>


        <!-- Dark edges -->

        <div class="vignette"></div>


        <!-- Red glow -->

        <div class="red-glow"></div>


        <!-- ======================================
             MAIN CONTENT
        ======================================= -->

        <section class="content">


            <!-- TITLE -->

            <header class="title">

                <h1>
                    ANNIVERSARY
                </h1>

                <h2>
                    IS COMING
                </h2>

            </header>


            <!-- HEART LINE -->

            <div class="heart-divider">

                <span></span>

                <div class="heart">
                    ♡
                </div>

                <span></span>

            </div>


            <!-- ==================================
                 COUNTDOWN
            =================================== -->

            <section
                class="countdown"
                aria-label="Countdown to our anniversary"
            >


                <!-- MONTHS -->

                <div class="time-box">

                    <div
                        class="number"
                        id="months"
                    >
                        00
                    </div>

                    <div class="label">
                        MONTHS
                    </div>

                </div>


                <div class="colon">
                    :
                </div>


                <!-- DAYS -->

                <div class="time-box">

                    <div
                        class="number"
                        id="days"
                    >
                        00
                    </div>

                    <div class="label">
                        DAYS
                    </div>

                </div>


                <div class="colon">
                    :
                </div>


                <!-- HOURS -->

                <div class="time-box">

                    <div
                        class="number"
                        id="hours"
                    >
                        00
                    </div>

                    <div class="label">
                        HOURS
                    </div>

                </div>


                <div class="colon">
                    :
                </div>


                <!-- MINUTES -->

                <div class="time-box">

                    <div
                        class="number"
                        id="minutes"
                    >
                        00
                    </div>

                    <div class="label">
                        MINUTES
                    </div>

                </div>


                <div class="colon">
                    :
                </div>


                <!-- SECONDS -->

                <div class="time-box">

                    <div
                        class="number"
                        id="seconds"
                    >
                        00
                    </div>

                    <div class="label">
                        SECONDS
                    </div>

                </div>

            </section>


            <!-- DATE -->

            <div class="date">

                19 NOVEMBER 2026

            </div>


            <!-- ECG LINE -->

            <div class="ecg-divider">

                <span></span>


                <svg
                    class="ecg"
                    viewBox="0 0 90 40"
                    aria-hidden="true"
                >

                    <polyline
                        points="
                            0,20
                            22,20
                            28,15
                            33,29
                            40,5
                            46,34
                            53,11
                            60,20
                            90,20
                        "
                    />

                </svg>


                <span></span>

            </div>


            <!-- MESSAGE -->

            <p class="forever">

                THE COUNTDOWN TO OUR FOREVER.

            </p>


            <p class="always">

                You. Me. Always.

                <span class="small-heart">
                    ♡
                </span>

            </p>


        </section>


        <!-- ======================================
             SCROLL INDICATOR
        ======================================= -->

        <div class="scroll-indicator">

            <div class="mouse">

                <div class="wheel"></div>

            </div>


            <div class="arrow">
                ↓
            </div>


            <p>
                SCROLL DOWN
            </p>

        </div>


    </main>


    <script src="script.js"></script>

</body>

</html>
